name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Next.js app — typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Retrain and check the model still meets the quality bar
        run: |
          npm run data:generate
          npm run train
          node -e "const m=require('./reports/metrics.json'); const r2=m.models[m.best_model].test_r2; console.log('best', m.best_model, 'R2', r2); if (r2 < 0.9) process.exit(1)"
      - run: npm run build

  python:
    name: Python reference — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t carvalue-ml .
